<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nebula OS</title>
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>

  <!-- ============ BOOT SCREEN ============ -->
  <div id="boot-screen" class="boot-screen">
    <div class="boot-logo">
      <svg width="72" height="84" viewBox="0 0 15 18" fill="currentColor" aria-hidden="true">
        <path d="M12.6 9.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.7-3-2-3.7-2-1.6-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.9-1.7 0-3.2 1-4.1 2.5C-1.2 9.3.4 13.3 1.6 15.2c.6.9 1.3 2 2.3 2 1 0 1.3-.6 2.5-.6 1.2 0 1.6.6 2.5.6 1 0 1.7-1 2.3-1.9.7-1 1-2.1 1-2.1s-2.7-1.1-2.6-4.6zM10.5 1.9c.5-.6.8-1.5.7-2.3-.7 0-1.6.5-2.1 1.1-.5.5-.9 1.4-.8 2.2.8.1 1.6-.4 2.2-1z"/>
      </svg>
    </div>
    <div class="boot-bar"><div class="boot-fill" id="boot-fill"></div></div>
    <div class="boot-made">Made with ❤️ by Muhammad Saleh</div>
    <div class="boot-skip">click anywhere to skip</div>
  </div>

  <!-- ============ DESKTOP ============ -->
  <div id="desktop">
    <div id="wallpaper"></div>
    <div id="icons" class="icons"></div>
    <div id="windows"></div>
    <div id="snap-hint" class="snap-hint" hidden></div>
    <div id="context-menu" class="context-menu" hidden></div>
  </div>

  <!-- ============ MENUBAR ============ -->
  <div id="menubar">
    <div class="menu-left">
      <button class="menu-item" data-menu="apple" title="Nebula">
        <svg width="13" height="16" viewBox="0 0 15 18" fill="currentColor" aria-hidden="true">
          <path d="M12.6 9.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.7-3-2-3.7-2-1.6-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.9-1.7 0-3.2 1-4.1 2.5C-1.2 9.3.4 13.3 1.6 15.2c.6.9 1.3 2 2.3 2 1 0 1.3-.6 2.5-.6 1.2 0 1.6.6 2.5.6 1 0 1.7-1 2.3-1.9.7-1 1-2.1 1-2.1s-2.7-1.1-2.6-4.6zM10.5 1.9c.5-.6.8-1.5.7-2.3-.7 0-1.6.5-2.1 1.1-.5.5-.9 1.4-.8 2.2.8.1 1.6-.4 2.2-1z"/>
        </svg>
      </button>
      <button class="menu-item bold" data-menu="app" id="mb-appname">Nebula</button>
      <button class="menu-item" data-menu="file">File</button>
      <button class="menu-item" data-menu="edit">Edit</button>
      <button class="menu-item" data-menu="view">View</button>
      <button class="menu-item" data-menu="window">Window</button>
      <button class="menu-item" data-menu="help">Help</button>
    </div>
    <div class="menu-right">
      <button id="mb-battery" class="mb-icon" title="Battery">
        <svg width="19" height="11" viewBox="0 0 19 11" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
          <rect x="0.6" y="0.6" width="15" height="9.8" rx="2.6"/>
          <rect x="2.4" y="2.4" width="9.5" height="6.2" rx="1.2" fill="currentColor" stroke="none"/>
          <path d="M17 3.5v4a2 2 0 0 0 0-4z" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button id="mb-wifi" class="mb-icon" title="Wi-Fi">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="M1.5 4.5a10.5 10.5 0 0 1 13 0"/>
          <path d="M4 7a6.5 6.5 0 0 1 8 0"/>
          <path d="M6.5 9.4a3 3 0 0 1 3 0"/>
          <circle cx="8" cy="11" r="1.2" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button id="mb-cc" class="mb-icon" title="Control Center">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
          <rect x="1" y="3" width="14" height="10" rx="5" opacity="0.28"/>
          <rect x="2.5" y="4.5" width="11" height="7" rx="3.5"/>
          <rect x="4.5" y="6" width="4" height="4" rx="2" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button id="mb-search" class="mb-icon" title="Spotlight Search">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="6" cy="6" r="4.4"/>
          <path d="M9.5 9.5 13 13"/>
        </svg>
      </button>
      <button id="mb-clock" class="mb-clock" title="Nebula time">—</button>
    </div>
  </div>

  <!-- ============ MENU DROPDOWNS ============ -->
  <div id="menu-drop" class="menu-drop" hidden></div>

  <!-- ============ DOCK ============ -->
  <div id="dock">
    <div id="dock-items" class="dock-items"></div>
    <div class="dock-divider"></div>
    <div id="dock-trash" class="dock-items"></div>
  </div>

  <!-- ============ LAUNCHPAD ============ -->
  <div id="launchpad" class="launchpad" hidden>
    <input id="lp-search" class="lp-search" type="text" placeholder="Search" autocomplete="off" spellcheck="false" />
    <div id="lp-grid" class="lp-grid"></div>
  </div>

  <!-- ============ MISSION CONTROL ============ -->
  <div id="mc" class="mc" hidden>
    <div id="mc-grid" class="mc-grid"></div>
  </div>

  <!-- ============ MINI PLAYER ============ -->
  <div id="mini-player" hidden>
    <div class="mini-art">🎵</div>
    <div class="mini-info">
      <div class="mini-title">—</div>
      <div class="mini-artist">—</div>
    </div>
    <button class="mini-btn" id="mini-prev" title="Previous">⏮</button>
    <button class="mini-btn play" id="mini-play" title="Play / Pause">▶</button>
    <button class="mini-btn" id="mini-next" title="Next">⏭</button>
    <button class="mini-btn" id="mini-mute" title="Mute">🔊</button>
    <button class="mini-btn" id="mini-close" title="Hide">✕</button>
    <div class="mini-progress"><div class="mini-progress-fill"></div></div>
  </div>

  <!-- ============ SPOTLIGHT ============ -->
  <div id="spotlight" class="spotlight" hidden>
    <div class="sp-box">
      <input id="sp-input" class="sp-input" type="text" placeholder="Spotlight Search" autocomplete="off" spellcheck="false" />
      <div id="sp-results" class="sp-results"></div>
    </div>
  </div>

  <!-- ============ CONTROL CENTER ============ -->
  <div id="cc" class="cc" hidden>
    <div class="cc-row">
      <button class="cc-toggle on" id="cc-wifi">
        <span class="cc-ico">
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M1.5 4.5a10.5 10.5 0 0 1 13 0"/>
            <path d="M4 7a6.5 6.5 0 0 1 8 0"/>
            <path d="M6.5 9.4a3 3 0 0 1 3 0"/>
            <circle cx="8" cy="11" r="1.2" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span>Wi-Fi</span>
        <span class="cc-state">On</span>
      </button>
      <button class="cc-toggle on" id="cc-bt">
        <span class="cc-ico">✷</span>
        <span>Bluetooth</span>
        <span class="cc-state">On</span>
      </button>
    </div>
    <div class="cc-group">
      <div class="cc-label">Display</div>
      <div class="cc-slider-row">
        <span class="cc-slider-ico">☀️</span>
        <input type="range" id="cc-bright" min="30" max="150" value="100" />
      </div>
      <div class="cc-label">Sound</div>
      <div class="cc-slider-row">
        <span class="cc-slider-ico">🔊</span>
        <input type="range" id="cc-vol" min="0" max="100" value="70" />
        <span class="cc-vol-val" id="cc-vol-val">70%</span>
      </div>
    </div>
    <div class="cc-tiles">
      <button class="cc-tile" id="cc-sleep">🔒<span>Sleep</span></button>
      <button class="cc-tile" id="cc-restart">⏻<span>Restart</span></button>
      <button class="cc-tile" id="cc-lock">🔐<span>Lock</span></button>
    </div>
    <div class="cc-label cc-wall-label">Wallpaper</div>
    <div class="cc-wall" id="cc-wall"></div>
  </div>

  <!-- ============ SLEEP / LOCK SCREEN ============ -->
  <div id="sleep-screen" class="sleep-screen" hidden>
    <div class="sleep-clock">
      <div class="sleep-time" id="sleep-time">--:--</div>
      <div class="sleep-date" id="sleep-date"></div>
    </div>
    <div class="sleep-user">👤 guest</div>
    <div class="sleep-hint">click anywhere or press any key to wake</div>
  </div>

  <script src="app.js?v=3"></script>
</body>
</html>
